name: CSV editor regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check JavaScript syntax
        run: |
          for file in *.js tests/*.cjs; do node --check "$file"; done
      - name: Run Node regression checks
        run: node --test tests/*.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 et-xmlfile==2.0.0
      - name: Check workbook ZIP, XML and reader compatibility
        run: |
          node tests/workbook-fixture.cjs "$RUNNER_TEMP/csv-editor.xlsx"
          python tests/check_workbook.py "$RUNNER_TEMP/csv-editor.xlsx" --reader
